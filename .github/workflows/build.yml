name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Download English pronunciation dictionary
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/cmudict.dict https://raw.githubusercontent.com/cmusphinx/cmudict/master/cmudict.dict
      - run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: interpreter-apk
          path: app/build/outputs/apk/debug/app-debug.apk