name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -di keystore.b64 > ~/.android/debug.keystore
          base64 -di keystore.b64 > app/debug.keystore
      - name: Download English pronunciation dictionary
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/cmudict.dict https://raw.githubusercontent.com/cmusphinx/cmudict/master/cmudict.dict
      - run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon
      - name: Show signing key fingerprint
        run: |
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v5
        with:
          name: interpreter-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Google Play release: built only on main when the upload key secrets are set (see RELEASE.md).
      - name: Build Play Store bundle
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease -Pandroid.useAndroidX=true --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      # Without the upload key secrets, main still builds an unsigned store bundle and keeps it on the
      # store-builds branch, where it can be signed with the upload key outside GitHub.
      - name: Unsigned Play Store bundle
        if: github.ref == 'refs/heads/main' && env.HAS_KEY != 'true'
        run: |
          gradle bundleRelease -Pandroid.useAndroidX=true --no-daemon
          AAB=app/build/outputs/bundle/release/app-release.aab
          VC=$(( ${GITHUB_RUN_NUMBER} + 1000 ))
          mkdir -p /tmp/out && cp "$AAB" "/tmp/out/owl-interpreter-${VC}-unsigned.aab"
          cd /tmp/out
          git init -q -b store-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Unsigned store bundle from run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})" > README.txt
          git add -A && git commit -q -m "Store bundle ${VC} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" store-builds
      - name: Check 16 KB page alignment
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ZIPALIGN=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)zipalign
          $ZIPALIGN -c -P 16 -v 4 "$APK" > /tmp/align.txt 2>&1 && echo "zip alignment OK" || (grep -v "(OK" /tmp/align.txt | tail -20; echo "::warning::Some native libraries are not 16 KB aligned")
      - uses: actions/upload-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          name: play-store-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
